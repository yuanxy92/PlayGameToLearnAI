<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>神经水厂</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #24304a;
      --sky: #bfe7ff;
      --grass: #dff3da;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 16% 9%, rgba(255, 230, 141, .46), transparent 24%),
        linear-gradient(180deg, var(--sky) 0%, #eaf8ff 46%, var(--grass) 100%);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #game-shell {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    #game {
      width: min(100vw, calc(100dvh * 390 / 844));
      height: min(100dvh, calc(100vw * 844 / 390));
      max-width: 520px;
      max-height: 100dvh;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      border-radius: min(18px, 2.2vh);
      box-shadow: 0 18px 42px rgba(43, 58, 91, .2);
    }

    .fallback {
      position: fixed;
      inset: 18px;
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 18px;
      line-height: 1.65;
      color: #24304a;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-shell">
    <div id="game"></div>
  </div>
  <div class="fallback" id="fallback" hidden>
    <div>
      <strong>游戏引擎还没加载出来。</strong><br>
      请用本地服务器打开，或检查网络后刷新。
    </div>
  </div>

  <script>
    (() => {
      if (!window.Phaser) {
        document.getElementById("fallback").hidden = false;
        return;
      }

      const W = 390;
      const H = 844;
      const storageKey = "pipenet-lab-progress-v2";
      const legacyStorageKey = "pipenet-lab-progress-v1";
      const urlParams = new URLSearchParams(window.location.search);
      const debugUnlock = ["play", "debug", "unlock"].some(key => urlParams.get(key) === "1");
      const PIPE_NUDGE = 0.02;
      const BIAS_NUDGE = 0.02;
      const colors = {
        ink: 0x24304a,
        muted: 0x66728a,
        panel: 0xfffbef,
        paper: 0xffffff,
        blue: 0x2f8ee8,
        blueDark: 0x1e66b5,
        water: 0x46b8ff,
        waterLight: 0xbdf3ff,
        supply: 0x39bc80,
        pump: 0xff775c,
        gold: 0xffb22e,
        goldDark: 0xd88a12,
        pipeRim: 0xd9ae75,
        pipeInner: 0xf7dab1,
        line: 0xc8d8ec
      };

      const levels = [
        {
          id: "c1-1",
          title: "接通山泉",
          concept: "水流会沿管道送到供水池。",
          lesson: "输水管会把上游水源送到下游。第一关里，山泉流量被原样送进供水池。",
          objective: "接上第一根输水管，让供水池贴近黄线。",
          tolerance: 0.04,
          samples: [{ inputs: [0.72], target: 0.72 }],
          inputNames: ["山泉"],
          pipes: [{ id: "w1", label: "山泉输水管", input: 0, type: "supply", strength: 1, installed: false, lockType: true, lockStrength: true }],
          bias: null
        },
        {
          id: "c1-2",
          title: "调管道粗细",
          concept: "管道越粗，送来的水越多。",
          lesson: "管道粗细决定这股水的影响。管越粗，送到供水池的流量越大。",
          objective: "山泉水很足，小镇只需要适量供水。调细管道，别让供水池溢出。",
          tolerance: 0.035,
          samples: [{ inputs: [1.0], target: 0.6 }],
          inputNames: ["山泉"],
          pipes: [{ id: "w1", label: "山泉输水管", input: 0, type: "supply", strength: 0.35, installed: true, lockType: true }],
          bias: null
        },
        {
          id: "c1-3",
          title: "两个水源合流",
          concept: "多处水源会在合流池汇合。",
          lesson: "合流池会把多处水源加在一起。每根管道都给最终水位贡献一部分。",
          objective: "把山泉和井水都接入合流池，让供水池贴近黄线。",
          tolerance: 0.04,
          samples: [{ inputs: [0.35, 0.45], target: 0.8 }],
          inputNames: ["山泉", "井水"],
          pipes: [
            { id: "w1", label: "山泉输水管", input: 0, type: "supply", strength: 1, installed: true, lockType: true },
            { id: "w2", label: "井水输水管", input: 1, type: "supply", strength: 0, installed: false, lockType: true }
          ],
          bias: null
        },
        {
          id: "c1-4",
          title: "抽水管的抑制",
          concept: "抽水管会压低总水位。",
          lesson: "抽水管不是让水倒流，而是在合流池里抵消一部分水位，用来压住过高的输出。",
          objective: "雨水槽来水会让水位过高。改用抽水管，把供水池压回黄线。",
          tolerance: 0.045,
          samples: [{ inputs: [0.9, 0.5], target: 0.42 }],
          inputNames: ["山泉", "雨水槽"],
          pipes: [
            { id: "w1", label: "山泉管道", input: 0, type: "supply", strength: 0.55, installed: true },
            { id: "w2", label: "雨水槽管道", input: 1, type: "supply", strength: 0.15, installed: true }
          ],
          bias: null
        },
        {
          id: "c1-5",
          title: "加一座泵站",
          concept: "泵站能整体抬高或降低水位。",
          lesson: "泵站会给整段水路加一点基础水压。它不依赖某一处水源，而是整体抬高或降低供水。",
          objective: "基础水压偏低。启动泵站，把整段水路托到黄线附近。",
          tolerance: 0.035,
          samples: [{ inputs: [0.5], target: 0.8 }],
          inputNames: ["山泉"],
          pipes: [{ id: "w1", label: "山泉输水管", input: 0, type: "supply", strength: 0.72, installed: true, lockType: true }],
          bias: { value: 0, min: -0.5, max: 0.7 }
        },
        {
          id: "c1-6",
          title: "一天里的几种水情",
          concept: "同一套水路要照顾多种水情。",
          lesson: "同一套管道不能只适合一种水情。它要在不同来水情况下都尽量稳定。",
          objective: "早、中、晚来水不同。调同一套管道和泵站，让三次水情都尽量稳定。",
          tolerance: 0.06,
          samples: [
            { inputs: [0], target: 0.2 },
            { inputs: [0.5], target: 0.6 },
            { inputs: [1], target: 1.0 }
          ],
          inputNames: ["山泉"],
          pipes: [{ id: "w1", label: "山泉输水管", input: 0, type: "supply", strength: 0.45, installed: true, lockType: true }],
          bias: { value: 0.05, min: -0.3, max: 0.6 }
        },
        {
          id: "c1-7",
          title: "全天水路日志",
          concept: "多种水情下都稳定才算过关。",
          lesson: "全天通水看的是多种水情下的整体表现。单次刚好还不够，全天稳定才算好。",
          objective: "调两根管道和泵站，让小镇全天都稳定。",
          tolerance: 0.055,
          samples: [
            { inputs: [0.2, 0.8], target: 0.10 },
            { inputs: [0.8, 0.2], target: 0.55 },
            { inputs: [0.7, 0.7], target: 0.38 }
          ],
          inputNames: ["山泉", "雨水槽"],
          pipes: [
            { id: "w1", label: "山泉管道", input: 0, type: "supply", strength: 0.35, installed: true },
            { id: "w2", label: "雨水槽管道", input: 1, type: "pump", strength: 0.2, installed: true }
          ],
          bias: { value: 0.15, min: -0.4, max: 0.7 }
        }
      ];

      const savedProgress = (() => {
        try {
          return JSON.parse(localStorage.getItem(storageKey) || localStorage.getItem(legacyStorageKey) || "{}");
        } catch {
          return {};
        }
      })();

      const GAME_STATE = {
        progress: savedProgress,
        levelIndex: 0,
        mapChapter: urlParams.get("map") === "2" ? 2 : 1
      };

      function cloneLevel(level) {
        return JSON.parse(JSON.stringify(level));
      }

      function fmt(value) {
        return Number(value).toFixed(2);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function signedStrength(pipe) {
        return pipe.type === "pump" ? -pipe.strength : pipe.strength;
      }

      function calcForSample(level, sample) {
        let z = level.bias ? level.bias.value : 0;
        const terms = [];
        level.pipes.forEach(pipe => {
          if (!pipe.installed) return;
          const x = sample.inputs[pipe.input] || 0;
          const term = signedStrength(pipe) * x;
          z += term;
          terms.push({ pipe, x, term });
        });
        return { z, y: z, loss: Math.abs(z - sample.target), terms };
      }

      function calcAll(level) {
        const rows = level.samples.map(sample => calcForSample(level, sample));
        const meanLoss = rows.reduce((sum, row) => sum + row.loss, 0) / rows.length;
        return { rows, meanLoss };
      }

      function starForLoss(level, loss) {
        if (loss <= level.tolerance * 0.35) return 3;
        if (loss <= level.tolerance * 0.7) return 2;
        if (loss <= level.tolerance) return 1;
        return 0;
      }

      function waterStatus(output, target) {
        const diff = output - target;
        const gap = Math.abs(diff);
        if (gap <= 0.02) return "刚刚好";
        if (gap <= 0.08) return diff > 0 ? "稍微偏高" : "稍微偏低";
        if (gap <= 0.25) return diff > 0 ? "水有点多" : "水有点少";
        return diff > 0 ? "快溢出了" : "水太少了";
      }

      function strengthName(value) {
        if (value <= 0.02) return "关闭";
        if (value < 0.35) return "细管";
        if (value < 0.65) return "中管";
        if (value < 0.95) return "粗管";
        return "全开";
      }

      function isLevelUnlocked(index) {
        if (debugUnlock || index === 0) return true;
        const previous = levels[index - 1];
        return Boolean(previous && GAME_STATE.progress[previous.id] > 0);
      }

      function requestedLevelIndex() {
        const raw = Number(urlParams.get("level"));
        if (!Number.isFinite(raw)) return 0;
        return clamp(Math.round(raw) - 1, 0, levels.length - 1);
      }

      function passedCount() {
        return levels.filter(level => GAME_STATE.progress[level.id] > 0).length;
      }

      function chapterComplete() {
        return levels.every(level => GAME_STATE.progress[level.id] > 0);
      }

      function saveProgress(level, stars) {
        const old = GAME_STATE.progress[level.id] || 0;
        if (stars > old) {
          GAME_STATE.progress[level.id] = stars;
          localStorage.setItem(storageKey, JSON.stringify(GAME_STATE.progress));
        }
      }

      function addText(scene, x, y, text, size, color = colors.ink, options = {}) {
        return scene.add.text(x, y, text, {
          fontFamily: "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
          fontSize: `${size}px`,
          color: Phaser.Display.Color.IntegerToColor(color).rgba,
          fontStyle: options.weight || "700",
          align: options.align || "left",
          lineSpacing: options.lineSpacing || 4,
          wordWrap: options.wrap ? { width: options.wrap, useAdvancedWrap: true } : undefined,
          stroke: options.stroke ? Phaser.Display.Color.IntegerToColor(options.stroke).rgba : undefined,
          strokeThickness: options.strokeThickness || 0
        }).setOrigin(options.originX ?? 0, options.originY ?? 0);
      }

      function roundedRect(scene, x, y, w, h, radius, fill, alpha = 1, stroke, strokeWidth = 2) {
        const g = scene.add.graphics();
        g.fillStyle(fill, alpha);
        g.fillRoundedRect(x, y, w, h, radius);
        if (stroke !== undefined) {
          g.lineStyle(strokeWidth, stroke, 1);
          g.strokeRoundedRect(x, y, w, h, radius);
        }
        return g;
      }

      function makeButton(scene, x, y, w, h, label, onClick, opts = {}) {
        const container = scene.add.container(x, y);
        const hit = scene.add.rectangle(w / 2, h / 2, w, h, 0xffffff, .001);
        hit.setInteractive({ useHandCursor: true });
        hit.on("pointerdown", () => {
          scene.tweens.add({ targets: container, scale: .96, duration: 65, yoyo: true });
          onClick();
        });
        const bg = scene.add.graphics();
        bg.fillStyle(opts.fill ?? colors.paper, opts.alpha ?? 1);
        bg.fillRoundedRect(0, 0, w, h, opts.radius ?? 14);
        bg.lineStyle(opts.lineWidth ?? 2, opts.stroke ?? colors.line, 1);
        bg.strokeRoundedRect(0, 0, w, h, opts.radius ?? 14);
        if (opts.shadow) {
          const shade = scene.add.graphics();
          shade.fillStyle(opts.shadow, .22);
          shade.fillRoundedRect(2, 4, w, h, opts.radius ?? 14);
          container.add(shade);
        }
        const text = scene.add.text(w / 2, h / 2, label, {
          fontFamily: "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
          fontSize: `${opts.size ?? 18}px`,
          color: Phaser.Display.Color.IntegerToColor(opts.color ?? colors.ink).rgba,
          fontStyle: opts.weight || "800",
          align: "center",
          wordWrap: opts.wrap ? { width: opts.wrap, useAdvancedWrap: true } : undefined
        }).setOrigin(.5);
        container.add([bg, text, hit]);
        container.setSize(w, h);
        return container;
      }

      function drawPath(graphics, path, width, color, alpha = 1) {
        graphics.lineStyle(width, color, alpha);
        path.draw(graphics, 42);
      }

      function makeFlow(scene, path, color, reverse = false, count = 5, speed = .14) {
        const dots = [];
        for (let i = 0; i < count; i += 1) {
          dots.push(scene.add.circle(0, 0, 3.1, color, .95));
        }
        scene.flowDots.push({ path, dots, reverse, speed, offset: Math.random() });
      }

      function setImageCover(image, width, height) {
        const sx = width / image.width;
        const sy = height / image.height;
        image.setScale(Math.max(sx, sy));
      }

      class BootScene extends Phaser.Scene {
        constructor() {
          super("Boot");
        }

        preload() {
          this.load.image("boardBg", "assets/board-bg.png");
          this.load.image("chapterMap", "assets/chapter-map.png");
          this.load.image("sourceSpring", "assets/source-spring.png");
          this.load.image("mixingPool", "assets/mixing-pool.png");
          this.load.image("outputTank", "assets/output-tank.png");
          this.load.image("biasPump", "assets/bias-pump.png");
          this.load.image("qingxiTown", "assets/qingxi-town-alpha.png");
        }

        create() {
          if (urlParams.get("play") === "1") {
            this.scene.start("Level", { levelIndex: requestedLevelIndex() });
          } else if (urlParams.get("map") === "1" || urlParams.get("map") === "2") {
            this.scene.start("Map");
          } else {
            this.scene.start("Welcome");
          }
        }
      }

      class WelcomeScene extends Phaser.Scene {
        constructor() {
          super("Welcome");
        }

        create() {
          this.cameras.main.setBackgroundColor("#ccefff");
          this.add.rectangle(W / 2, H / 2, W, H, 0xe4f7e6);
          this.add.image(W / 2, 380, "chapterMap").setDisplaySize(390, 640).setAlpha(.38);
          roundedRect(this, 22, 58, 346, 412, 28, 0xffffff, .88, 0xb6cee9, 2);
          addText(this, 42, 82, "神经水厂", 38, colors.ink, { weight: "900" });
          addText(this, 44, 132, "青溪镇通水冒险", 22, colors.muted);
          addText(
            this,
            44,
            188,
            "清溪镇新建了一座会思考的水厂。它要根据山泉、井水、雨水槽的来水，自动调出刚刚好的供水量。\n\n水太少，镇上的水塔会见底；水太多，管道会报警。你的任务是修水路、调水管、写下水路档案，让每一段供水都稳稳贴住黄线。",
            18,
            colors.ink,
            { weight: "700", wrap: 296, lineSpacing: 8 }
          );
          addText(this, 44, 394, "第 1 章：先学会一条最基础的水路。", 16, colors.blueDark, { weight: "800", wrap: 292 });
          makeButton(this, 42, 520, 306, 64, "开始冒险", () => this.scene.start("Map"), {
            fill: colors.blue,
            stroke: colors.blueDark,
            color: 0xffffff,
            size: 24,
            shadow: colors.blueDark
          });
          makeButton(this, 42, 604, 306, 52, "直接进第一关", () => this.scene.start("Level", { levelIndex: 0 }), {
            fill: 0xffffff,
            stroke: colors.line,
            color: colors.ink,
            size: 18
          });
        }
      }

      class MapScene extends Phaser.Scene {
        constructor() {
          super("Map");
        }

        create() {
          this.cameras.main.setBackgroundColor("#c9efff");
          this.render();
        }

        render() {
          this.children.removeAll();
          const map = this.add.image(W / 2, H / 2, "chapterMap");
          setImageCover(map, W, H);
          this.add.rectangle(W / 2, H / 2, W, H, GAME_STATE.mapChapter === 2 ? 0xcdf3ee : 0xffffff, GAME_STATE.mapChapter === 2 ? .28 : .08);
          this.add.rectangle(W / 2, 54, W, 108, 0xcbefff, .82);
          addText(this, 20, 24, "神经水厂", 30, colors.ink, { weight: "900" });
          addText(this, 22, 62, "青溪镇通水冒险", 17, colors.muted, { weight: "700" });
          makeButton(this, 300, 25, 70, 54, "地图", () => {}, {
            fill: 0xffffff,
            stroke: 0x94b6d9,
            size: 20
          });

          if (GAME_STATE.mapChapter === 1) {
            this.renderChapterOneMap();
          } else {
            this.renderChapterTwoPreview();
          }
        }

        renderChapterOneMap() {
          const pathPoints = [
            { x: 116, y: 708 },
            { x: 181, y: 628 },
            { x: 270, y: 552 },
            { x: 184, y: 480 },
            { x: 184, y: 408 },
            { x: 235, y: 316 },
            { x: 197, y: 244 }
          ];

          roundedRect(this, 24, 118, 266, 92, 18, 0xffffff, .78, 0xffffff, 0);
          addText(this, 44, 146, "青溪镇地图", 31, colors.ink, { weight: "900" });
          addText(this, 46, 188, `第 1 章：线性水路 ${passedCount()}/7`, 17, colors.muted, { weight: "800" });

          pathPoints.forEach((point, index) => {
            const unlocked = isLevelUnlocked(index);
            const done = Boolean(GAME_STATE.progress[levels[index].id]);
            const ring = this.add.circle(point.x, point.y, 32, done ? colors.gold : 0xffffff, 1);
            ring.setStrokeStyle(6, done ? colors.goldDark : unlocked ? colors.gold : 0x9aa8bd);
            const inner = this.add.circle(point.x, point.y, 22, unlocked ? 0xffffff : 0xe7edf5, 1);
            inner.setStrokeStyle(2, 0xffffff, .9);
            const label = addText(this, point.x, point.y + 1, String(index + 1), 24, unlocked ? colors.blueDark : colors.muted, { weight: "900", originX: .5, originY: .5 });
            const hit = this.add.circle(point.x, point.y, 40, 0xffffff, .001);
            hit.setInteractive({ useHandCursor: unlocked });
            hit.on("pointerdown", () => {
              if (!unlocked) return;
              GAME_STATE.levelIndex = index;
              this.scene.start("Level", { levelIndex: index });
            });
            if (!unlocked) {
              addText(this, point.x, point.y + 39, "未开", 12, 0xffffff, { weight: "900", originX: .5, stroke: colors.ink, strokeThickness: 4 });
            } else if (done) {
              addText(this, point.x, point.y + 39, "已通水", 12, 0xffffff, { weight: "900", originX: .5, stroke: colors.ink, strokeThickness: 4 });
            }
            this.tweens.add({ targets: [ring, inner, label], y: "-=3", duration: 1100 + index * 70, yoyo: true, repeat: -1, ease: "Sine.inOut" });
          });

          makeButton(this, 24, 784, 156, 44, "第 1 章 已解锁", () => {}, {
            fill: colors.blue,
            stroke: colors.blueDark,
            color: 0xffffff,
            size: 16
          });
          makeButton(this, 196, 784, 170, 44, "去看第 2 章", () => {
            GAME_STATE.mapChapter = 2;
            this.render();
          }, {
            fill: 0xffffff,
            stroke: colors.line,
            color: colors.ink,
            size: 16
          });
        }

        renderChapterTwoPreview() {
          this.add.rectangle(W / 2, H / 2, W, H, 0x4dbca7, .24);
          roundedRect(this, 28, 140, 334, 226, 22, 0xffffff, .84, 0xb8d1e8, 2);
          addText(this, 52, 166, "第 2 章：闸门谷", 30, colors.ink, { weight: "900" });
          addText(
            this,
            54,
            214,
            "下一章会把“线性水路”接到各种闸门：有的闸门挡住负水位，有的闸门会把水压进固定范围，最后再进入多出口分流。",
            18,
            colors.muted,
            { weight: "800", wrap: 280, lineSpacing: 7 }
          );
          const items = ["止回闸", "限流闸", "软闸门", "S 形水门", "分流池"];
          items.forEach((name, index) => {
            const y = 410 + index * 58;
            this.add.circle(74, y + 18, 20, 0xffffff, .96).setStrokeStyle(4, colors.gold);
            addText(this, 74, y + 18, String(index + 1), 18, colors.blueDark, { originX: .5, originY: .5, weight: "900" });
            addText(this, 112, y + 6, name, 20, colors.ink, { weight: "900" });
            addText(this, 112, y + 31, "设计中", 14, colors.muted, { weight: "800" });
          });
          makeButton(this, 28, 768, 156, 52, "回第 1 章", () => {
            GAME_STATE.mapChapter = 1;
            this.render();

        selectPipe(id) {
          const pipe = this.level.pipes.find(item => item.id === id);
          if (!pipe) return;
          if (!pipe.installed && pipe.lockType && pipe.lockStrength) {
            pipe.installed = true;
            this.feedback = "管道接上了，水已经流向供水池。";
            this.feedbackKind = "good";
            this.selected = null;
            this.render();
            return;
          }
          this.selected = { kind: "pipe", id };
          this.feedback = pipe.installed ? "可以调这根管道。" : "先安装，再调水量。";
          this.feedbackKind = "neutral";
          this.render();
        }

        setPipe(pipe, value) {
          if (pipe.lockStrength) return;
          pipe.strength = clamp(Math.round(value * 100) / 100, 0, 1.2);
          pipe.installed = true;
          this.feedback = "观察供水池和黄线的距离。";
          this.feedbackKind = "neutral";
          this.render();
        }

        setBias(value) {
          this.level.bias.value = clamp(Math.round(value * 100) / 100, this.level.bias.min, this.level.bias.max);
          this.feedback = "观察供水池和黄线的距离。";
          this.feedbackKind = "neutral";
          this.render();
        }

        checkLevel() {
          const all = calcAll(this.level);
          const stars = starForLoss(this.level, all.meanLoss);
          if (stars > 0) {
            saveProgress(levels[this.levelIndex], stars);
            this.clearModal = { stars };
            this.feedback = "水路打通！";
            this.feedbackKind = "good";
            this.render();
          } else if (all.meanLoss <= this.level.tolerance * 1.8) {
            this.feedback = "很接近了，还差一点就能贴住黄线。";
            this.feedbackKind = "neutral";
            this.render();
          } else {
            this.feedback = "还没稳住。水位偏低就加水，偏高就减水或抽水。";
            this.feedbackKind = "neutral";
            this.render();
          }

          addText(this, W / 2, 270, `${"★".repeat(modal.stars)}${"☆".repeat(3 - modal.stars)}`, 30, colors.gold, { weight: "900", originX: .5 }).setDepth(22);
          addText(this, 62, 322, modal.stars >= 3 ? "供水池稳稳贴住黄线，清溪镇这一段恢复供水。" : "水路通了，小镇可以继续往前铺管。", 18, colors.ink, { weight: "800", wrap: 266, lineSpacing: 6 }).setDepth(22);
          addText(this, 62, 402, this.level.lesson, 15, colors.muted, { weight: "800", wrap: 266, lineSpacing: 5 }).setDepth(22);
          makeButton(this, 58, 480, 112, 42, "再玩一次", () => {
            this.clearModal = null;
            this.scene.restart({ levelIndex: this.levelIndex });
          }, {
            fill: 0xffffff,
            stroke: colors.line,
            size: 16
          }).setDepth(23);
          makeButton(this, 186, 480, 146, 42, this.levelIndex >= levels.length - 1 ? "查看档案" : "下一关", () => {
            if (this.levelIndex >= levels.length - 1) {
              this.scene.start("Summary");
            } else {
              this.scene.start("Level", { levelIndex: this.levelIndex + 1 });
            }
          }, {
            fill: colors.blue,
            stroke: colors.blueDark,
            color: 0xffffff,
            size: 16,
            shadow: colors.blueDark
          }).setDepth(23);
        }

        update(time, delta) {
          const dt = delta / 1000;
          this.flowDots.forEach(flow => {
            flow.offset = (flow.offset + dt * flow.speed) % 1;
            flow.dots.forEach((dot, index) => {
              let t = (flow.offset + index / flow.dots.length) % 1;
              if (flow.reverse) t = 1 - t;
              const point = flow.path.getPoint(t);
              dot.setPosition(point.x, point.y);
              dot.setAlpha(.45 + .45 * Math.sin((t + flow.offset) * Math.PI));
            });
          });
        }
      }

            roundedRect(this, 46, y, 298, 78, 16, index === 3 ? 0xe9f5ff : 0xfffbef, 1, 0xd4e1ef, 2);
            addText(this, 64, y + 13, item[0], 16, colors.blueDark, { weight: "900" });
            addText(this, 64, y + 40, item[1], index === 3 ? 22 : 17, colors.ink, { weight: "900", wrap: 250 });
          });
          addText(this, 48, 662, "下一章会加入闸门：水不是直接流过去，而是先经过会改变水量的机关。这就是激活函数的直觉。", 16, colors.muted, { weight: "800", wrap: 292, lineSpacing: 6 });
          makeButton(this, 44, 774, 142, 48, "回地图", () => this.scene.start("Map"), {
            fill: 0xffffff,
            stroke: colors.line,
            size: 18
          });
          makeButton(this, 202, 774, 144, 48, "看第 2 章", () => {
            GAME_STATE.mapChapter = 2;
            this.scene.start("Map");
          }, {
            fill: colors.blue,
            stroke: colors.blueDark,
            color: 0xffffff,
            size: 18,
            shadow: colors.blueDark
          });
        }
      }

      new Phaser.Game({
        type: Phaser.AUTO,
        parent: "game",
        width: W,
        height: H,
        backgroundColor: "#ccefff",
        pixelArt: false,
        roundPixels: true,
        scale: {
          mode: Phaser.Scale.FIT,
          autoCenter: Phaser.Scale.CENTER_BOTH
        },
        scene: [BootScene, WelcomeScene, MapScene, LevelScene, SummaryScene]
      });
    })();
  </script>
