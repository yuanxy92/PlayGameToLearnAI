<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>第 1 关 UI 对齐工具</title>
  <style>
    :root {
      --ink: #23304a;
      --muted: #68758e;
      --blue: #2f8ee8;
      --line: #c8ddf0;
      --panel: rgba(255, 255, 255, 0.92);
      --accent: #ffb12a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #e6f6ff;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(360px, 1fr) 430px;
      gap: 18px;
      min-height: 100vh;
      padding: 18px;
    }

    .previewShell,
    .side {
      border: 2px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 18px 50px rgba(44, 94, 140, 0.12);
    }

    .previewShell {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: auto;
    }

    .stage {
      position: relative;
      width: min(560px, calc(100vw - 520px));
      aspect-ratio: 1080 / 1920;
      min-width: 330px;
      user-select: none;
      touch-action: none;
      background: #d9efff;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(34, 83, 130, 0.18);
    }

    .stage img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
    }

    .stage img.hudArt {
      inset: auto;
      left: 0;
      width: 100%;
      object-fit: fill;
      z-index: 6;
    }

    .stage img.bottomHudArt {
      top: 65.1%;
      height: 34.9%;
      display: none;
    }

    .runtimeChrome {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .runtimeSprite {
      position: absolute;
      object-fit: fill;
      pointer-events: none;
      z-index: 1;
      transform: translate(-50%, -50%);
    }

    .objectivePlateBg {
      position: absolute;
      border-radius: 42px;
      background: rgba(244, 251, 255, 0.66);
      border: 2px solid rgba(255, 255, 255, 0.58);
      box-shadow: inset 0 8px 14px rgba(255, 255, 255, 0.24);
    }

    .objectivePlateBg::before {
      content: "";
      position: absolute;
      left: 4%;
      top: 12%;
      width: 92%;
      height: 34%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.26);
    }

    .controlPanelBase {
      position: absolute;
      left: 2.59%;
      top: 65.42%;
      width: 94.82%;
      height: 31.46%;
      border-radius: 52px;
      background: #fff9ed;
      border: 5px solid rgba(220, 165, 82, 0.9);
      box-shadow:
        0 10px 0 rgba(194, 135, 62, 0.42),
        inset 0 0 0 7px rgba(255, 255, 255, 0.72);
    }

    .pipeIconSlot,
    .smallControlSlot,
    .sliderControl,
    .buttonSurface {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .pipeIconSlot {
      width: 14.63%;
      height: 8.23%;
      border-radius: 999px;
      background: #fff6e0;
      border: 8px solid #ffdf5a;
      box-shadow: inset 0 0 0 5px #fff, 0 8px 14px rgba(160, 100, 32, 0.28);
    }

    .smallControlSlot {
      width: 7.78%;
      height: 5%;
      border-radius: 18px;
      background: #ffedca;
      border: 4px solid rgba(205, 148, 69, 0.92);
      box-shadow: inset 0 10px 12px rgba(255, 255, 255, 0.36);
    }

    .smallControlSlot.blue {
      background: #53b0fa;
      border-color: #196bc3;
    }

    .sliderControl {
      width: 40.37%;
      height: 5.31%;
    }

    .sliderControl::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 24%;
      height: 52%;
      border-radius: 999px;
      background: #f4e1c2;
      border: 3px solid rgba(194, 137, 72, 0.82);
    }

    .sliderControl::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 19.26%;
      height: 100%;
      border-radius: 22px;
      background: #ffefd3;
      border: 4px solid rgba(199, 147, 82, 0.9);
      transform: translateX(-50%);
    }

    .buttonSurface {
      border-radius: 34px;
      box-shadow: 0 9px 0 rgba(194, 135, 62, 0.45), inset 0 12px 14px rgba(255, 255, 255, 0.36);
    }

    .buttonSurface.cream {
      background: #fff0d2;
      border: 5px solid rgba(194, 135, 62, 0.96);
    }

    .buttonSurface.blue {
      background: #2c9ff2;
      border: 5px solid #1461be;
      box-shadow: 0 9px 0 #135bb2, inset 0 12px 14px rgba(255, 255, 255, 0.22);
    }

    .flowSvg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 28;
    }

    .item {
      position: absolute;
      display: grid;
      place-items: center;
      transform: translate(-50%, -50%);
      text-align: center;
      cursor: grab;
      touch-action: none;
      z-index: 20;
    }

    .item:active {
      cursor: grabbing;
    }

    .item.selected {
      outline: 3px solid #ff4f57;
      outline-offset: 3px;
      z-index: 35;
    }

    .labelItem {
      border: 2px dashed rgba(47, 142, 232, 0.85);
      background: rgba(255, 255, 255, 0.35);
      color: #1f6eb6;
      font-weight: 900;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.95);
    }

    .cardItem {
      border-radius: 18px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.72);
      color: #23304a;
      font-weight: 900;
      text-shadow: 0 2px 0 #fff;
    }

    .rectItem {
      border: 3px dashed rgba(255, 177, 42, 0.95);
      border-radius: 18px;
      background: rgba(255, 177, 42, 0.12);
      color: #995f00;
      font-weight: 900;
    }

    .connectorItem {
      border: 3px solid rgba(255, 177, 42, 0.95);
      border-radius: 999px;
      background:
        linear-gradient(180deg, rgba(154, 237, 255, 0.86), rgba(31, 147, 232, 0.9)),
        linear-gradient(90deg, rgba(255, 177, 42, 0.96) 0 10%, transparent 10% 90%, rgba(255, 177, 42, 0.96) 90%);
      color: #ffffff;
      font-weight: 900;
      text-shadow: 0 2px 0 rgba(18, 80, 150, 0.55);
      box-shadow: 0 0 0 5px rgba(255, 220, 62, 0.22);
    }

    .spriteItem {
      border: 2px dashed rgba(255, 79, 87, 0.65);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      color: #ff4f57;
      font-weight: 900;
      text-shadow: 0 2px 0 #fff;
    }

    .spriteItem img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0.92;
    }

    .spriteItem span {
      position: relative;
      z-index: 1;
      align-self: end;
      margin-bottom: -24px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
    }

    .resizeHandle {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 3px solid #fff;
      border-radius: 999px;
      background: #ffb12a;
      box-shadow: 0 0 0 3px rgba(31, 118, 190, 0.75);
      cursor: ew-resize;
      z-index: 40;
    }

    .resizeHandle.right {
      right: -13px;
      top: 50%;
      transform: translate(50%, -50%);
    }

    .resizeHandle.corner {
      right: -13px;
      bottom: -13px;
      transform: translate(50%, 50%);
      cursor: nwse-resize;
    }

    .gaugeItem {
      border: 3px solid rgba(31, 118, 190, 0.95);
      border-radius: 999px;
      background: rgba(255, 248, 235, 0.98);
      box-shadow: inset 0 10px 18px rgba(255, 255, 255, 0.55);
      overflow: visible;
    }

    .gaugeItem .track {
      position: absolute;
      left: 4.5%;
      right: 4.5%;
      top: 18%;
      bottom: 18%;
      border-radius: 999px;
      background: rgba(252, 247, 236, 0.98);
      border: 2px solid rgba(235, 221, 193, 0.95);
      overflow: hidden;
    }

    .gaugeItem .track::before {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      top: 8px;
      height: 20%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.46);
    }

    .gaugeItem .fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(118, 220, 255, 0.98), rgba(35, 135, 230, 0.98));
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.42);
    }

    .gaugeItem .targetLine {
      position: absolute;
      top: -10%;
      bottom: -10%;
      width: 5px;
      border-radius: 999px;
      background: #ffb12a;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.55);
      transform: translateX(-50%);
    }

    .pointItem {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 3px solid #fff;
      background: #62d4ff;
      box-shadow: 0 0 0 3px rgba(31, 118, 190, 0.65);
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px;
    }

    h1 {
      margin: 0;
      font-size: 27px;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 15px;
    }

    .pill {
      padding: 10px 12px;
      border-radius: 14px;
      background: #eef7ff;
      color: #1f6eb6;
      font-weight: 800;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    input,
    textarea {
      width: 100%;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: #f7fbff;
      color: var(--ink);
      font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    input {
      padding: 9px 10px;
    }

    textarea {
      min-height: 250px;
      resize: vertical;
      padding: 12px;
      font-size: 12px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .sizeTools {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 10px;
      border: 2px solid var(--line);
      border-radius: 16px;
      background: #f7fbff;
    }

    .sizeTools button {
      padding: 10px 6px;
      font-size: 13px;
      border-radius: 12px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 10px;
      background: var(--blue);
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: inset 0 -3px rgba(24, 94, 168, 0.35);
    }

    button.secondary {
      background: #fff;
      color: var(--ink);
      border: 2px solid var(--line);
      box-shadow: none;
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 930px) {
      .app {
        grid-template-columns: 1fr;
        padding: 10px;
      }

      .side {
        order: -1;
      }

      .stage {
        width: min(92vw, 560px);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="previewShell">
      <div class="stage" id="stage">
        <img src="../cocos-neural-pipe/assets/resources/art/level1/gameplay-bg-clean.png" alt="第 1 关纯背景">
        <img class="hudArt bottomHudArt" src="../cocos-neural-pipe/assets/resources/art/level1/ui-bottom-v2.png" alt="底栏参考">
        <div class="runtimeChrome" id="runtimeChrome"></div>
        <svg class="flowSvg" id="flowSvg" viewBox="0 0 1080 1920"></svg>
        <div id="overlay"></div>
      </div>
    </section>

    <aside class="side">
      <div>
        <h1>第 1 关 UI 对齐</h1>
        <p>拖动左侧的文字框、标签、水位条、黄框和蓝点。坐标使用 Cocos 固定画布：中心是 (0, 0)，上方为正 y。</p>
      </div>

      <div class="pill" id="selectedName">未选中元素</div>

      <div class="grid">
        <label>X <input id="fieldX" type="number" step="1"></label>
        <label>Y <input id="fieldY" type="number" step="1"></label>
        <label>宽 <input id="fieldWidth" type="number" step="1"></label>
        <label>高 <input id="fieldHeight" type="number" step="1"></label>
        <label>字号 <input id="fieldSize" type="number" step="1"></label>
        <label>副字号 <input id="fieldSubSize" type="number" step="1"></label>
      </div>

      <div class="sizeTools">
        <button id="shorterBtn">变短</button>
        <button id="longerBtn">变长</button>
        <button id="thinnerBtn">变薄</button>
        <button id="thickerBtn">变厚</button>
      </div>

      <p class="hint">选中“通水接头”后，用按钮调长度和粗细；也可以直接改“宽/高”。按住 Shift 点击按钮会一次调大步长。</p>

      <div class="actions">
        <button id="copyTsBtn">复制 TS</button>
        <button id="copyJsonBtn">复制 JSON</button>
        <button id="resetBtn" class="secondary">重置</button>
      </div>

      <p class="hint" id="copyHint">复制被浏览器拦截时，会自动选中文本；按 Cmd+C 就可以。</p>
      <textarea id="output" readonly></textarea>
    </aside>
  </main>

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function loadLayout() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return normalizeLayout(raw ? JSON.parse(raw) : clone(DEFAULT_LAYOUT));
      } catch {
        return clone(DEFAULT_LAYOUT);
      }
    }

    function normalizeLayout(value) {
      const merged = clone(DEFAULT_LAYOUT);
      deepAssign(merged, value);
      return merged;
    }

    function deepAssign(target, source) {
      if (!source || typeof source !== "object") return target;
      Object.entries(source).forEach(([key, value]) => {
        if (Array.isArray(value)) {
          target[key] = clone(value);
        } else if (value && typeof value === "object" && target[key] && typeof target[key] === "object" && !Array.isArray(target[key])) {
          deepAssign(target[key], value);
        } else {
          target[key] = value;
        }
      });
      return target;
    }

    function saveLayout() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(layout));
      output.value = toTs();
    }

    function pathParts(path) {
      return path.split(".").map((part) => (/^\d+$/.test(part) ? Number(part) : part));
    }

    function getByPath(path) {
      return pathParts(path).reduce((target, key) => target[key], layout);
    }

    function visualValueForSpec(spec) {
      if (spec.kind === "gauge") {
        const shellHeight = Math.max(layout.gauge.fillHeight + 34, layout.gauge.targetHeight + 18);
        return {
          x: layout.gauge.startX + layout.gauge.width / 2,
          y: layout.gauge.y,
          width: layout.gauge.width + 68,
          height: shellHeight
        };
      }
      return getByPath(spec.path);
    }

    function applyVisualPosition(path, x, y) {
      if (path === "gauge") {
        layout.gauge.startX = Math.round(x - layout.gauge.width / 2);
        layout.gauge.y = Math.round(y);
        return;
      }
      const value = getByPath(path);
      value.x = Math.round(x);
      value.y = Math.round(y);
    }

    function logicalToPercent(point) {
      return {
        left: (point.x + 540) / 1080 * 100,
        top: (960 - point.y) / 1920 * 100
      };
    }

    function logicalToViewBox(point) {
      return `${point.x + 540},${960 - point.y}`;
    }

    function eventToLogical(event) {
      const rect = stage.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width * 1080 - 540;
      const y = 960 - (event.clientY - rect.top) / rect.height * 1920;
      return { x: Math.round(x), y: Math.round(y) };
    }

    function setSelected(path) {
      selectedPath = path;

    function render() {
      overlay.innerHTML = "";

        if (value.height) item.style.height = `${value.height / 1920 * 100}%`;
        if (value.size) item.style.fontSize = `${Math.max(12, value.size * stage.clientWidth / 1080)}px`;
        if (spec.kind === "card") item.style.fontSize = `${Math.max(12, value.titleSize * stage.clientWidth / 1080)}px`;
        if (spec.kind === "gauge") {
          const track = document.createElement("span");

          track.appendChild(fill);

        } else if (spec.kind === "sprite") {
          const img = document.createElement("img");

          const text = document.createElement("span");

          item.textContent = spec.text;

        if (spec.kind === "connector" || spec.kind === "gauge") {
          item.appendChild(createResizeHandle("right", spec.path, "width"));
          item.appendChild(createResizeHandle("corner", spec.path, "both"));

        item.addEventListener("pointerdown", (event) => startDrag(event, spec.path));
        overlay.appendChild(item);

    function createResizeHandle(className, path, axis) {
      const handle = document.createElement("span");
      handle.className = `resizeHandle ${className}`;
      handle.addEventListener("pointerdown", (event) => startResize(event, path, axis));
      return handle;
    }

    function renderFlowLines() {
      flowSvg.innerHTML = "";
      [
        layout.visualPipes[0].flowPath,
        layout.visualPipes[1].flowPath
      ].forEach((points) => {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
        line.setAttribute("points", points.map(logicalToViewBox).join(" "));
        line.setAttribute("fill", "none");
        line.setAttribute("stroke", "rgba(98, 212, 255, 0.7)");
        line.setAttribute("stroke-width", "7");
        line.setAttribute("stroke-linecap", "round");
        line.setAttribute("stroke-linejoin", "round");
        flowSvg.appendChild(line);
      });
    }

    function startDrag(event, path) {
      event.preventDefault();
      const spec = [...specs, ...flowSpecs()].find((item) => item.path === path);
      const value = spec ? visualValueForSpec(spec) : getByPath(path);
      const point = eventToLogical(event);
      drag = {
        mode: "move",
        path,
        dx: value.x - point.x,
        dy: value.y - point.y
      };
      setSelected(path);
      event.currentTarget.setPointerCapture(event.pointerId);
    }

    function startResize(event, path, axis) {
      event.preventDefault();
      event.stopPropagation();
      const spec = [...specs, ...flowSpecs()].find((item) => item.path === path);
      const value = spec ? visualValueForSpec(spec) : getByPath(path);
      drag = {
        mode: "resize",
        path,
        axis,
        centerX: value.x,
        centerY: value.y
      };
      setSelected(path);
      event.currentTarget.setPointerCapture(event.pointerId);
    }

    window.addEventListener("pointermove", (event) => {
      if (!drag) return;
      const point = eventToLogical(event);
      if (drag.mode === "resize") {
        resizeFromPointer(drag.path, drag.axis, point, drag.centerX, drag.centerY);
      } else {
        applyVisualPosition(drag.path, point.x + drag.dx, point.y + drag.dy);
      }
      saveLayout();
      render();
      updateInspector();
    });

    window.addEventListener("pointerup", () => {
      drag = null;
    });

    window.addEventListener("keydown", (event) => {
      if (!selectedPath || document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA") return;
      const selectedSpec = [...specs, ...flowSpecs()].find((item) => item.path === selectedPath);
      const value = selectedSpec ? visualValueForSpec(selectedSpec) : getByPath(selectedPath);
      const step = event.shiftKey ? 10 : 1;
      if (event.key === "ArrowLeft") value.x -= step;
      else if (event.key === "ArrowRight") value.x += step;
      else if (event.key === "ArrowUp") value.y += step;
      else if (event.key === "ArrowDown") value.y -= step;
      else if (event.code === "BracketLeft") return resizeWithKey(event, "width", -(event.shiftKey ? 24 : 8));
      else if (event.code === "BracketRight") return resizeWithKey(event, "width", event.shiftKey ? 24 : 8);
      else if (event.code === "Semicolon") return resizeWithKey(event, "height", -(event.shiftKey ? 16 : 4));
      else if (event.code === "Quote") return resizeWithKey(event, "height", event.shiftKey ? 16 : 4);
      else return;
      event.preventDefault();
      applyVisualPosition(selectedPath, value.x, value.y);
      saveLayout();
      render();
      updateInspector();
    });

    function resizeWithKey(event, axis, delta) {
      event.preventDefault();
      resizeSelected(axis, delta);
    }

    function resizeFromPointer(path, axis, point, centerX, centerY) {
      if (path === "gauge") {
        if (axis === "width" || axis === "both") {
          layout.gauge.width = Math.max(80, Math.round(Math.abs(point.x - centerX) * 2 - 68));
        }
        if (axis === "height" || axis === "both") {
          layout.gauge.fillHeight = Math.max(16, Math.round(Math.abs(point.y - centerY) * 2 - 34));
        }
        return;
      }
      const value = getByPath(path);
      if ((axis === "width" || axis === "both") && value.width !== undefined) {
        value.width = Math.max(20, Math.round(Math.abs(point.x - centerX) * 2));
      }
      if ((axis === "height" || axis === "both") && value.height !== undefined) {
        value.height = Math.max(8, Math.round(Math.abs(point.y - centerY) * 2));
      }
    }

    function updateInspector() {
      const selectedSpec = [...specs, ...flowSpecs()].find((item) => item.path === selectedPath);
      const value = selectedSpec ? visualValueForSpec(selectedSpec) : getByPath(selectedPath);
      selectedName.textContent = selectedPath;
      setInput("x", value.x);
      setInput("y", value.y);
      setInput("width", value.width);
      setInput("height", value.height);
      setInput("size", value.size ?? value.titleSize);
      setInput("subtitleSize", value.subtitleSize);
    }

    function setInput(name, value) {
      fields[name].disabled = value === undefined;
      fields[name].value = value === undefined ? "" : value;
    }

    Object.entries(fields).forEach(([name, input]) => {
      input.addEventListener("input", () => {
        const next = Number(input.value);
        if (!Number.isFinite(next)) return;
        if (selectedPath === "gauge") {
          if (name === "x") layout.gauge.startX = Math.round(next - layout.gauge.width / 2);
          else if (name === "y") layout.gauge.y = next;
          else if (name === "width") layout.gauge.width = Math.max(80, Math.round(next - 68));
          else if (name === "height") layout.gauge.fillHeight = Math.max(16, Math.round(next - 34));
          saveLayout();
          render();
          updateInspector();
          return;
        }
        const value = getByPath(selectedPath);
        if (name === "size" && value.titleSize !== undefined) {
          value.titleSize = next;
        } else if (name in value) {
          value[name] = next;
        }
        saveLayout();
        render();
      });
    });

    function resizeSelected(axis, delta) {
      const selectedSpec = [...specs, ...flowSpecs()].find((item) => item.path === selectedPath);
      const value = selectedSpec ? visualValueForSpec(selectedSpec) : getByPath(selectedPath);
      if (!value || value[axis] === undefined) return;

      const min = axis === "width" ? 20 : 8;
      const next = Math.max(min, Math.round(value[axis] + delta));

      if (selectedPath === "gauge") {
        if (axis === "width") layout.gauge.width = Math.max(80, next - 68);
        if (axis === "height") layout.gauge.fillHeight = Math.max(16, next - 34);
      } else {
        getByPath(selectedPath)[axis] = next;
      }

      saveLayout();
      render();
      updateInspector();
    }

    function resizeStep(event, small = 8, large = 24) {
      return event.shiftKey ? large : small;
    }

    document.getElementById("shorterBtn").addEventListener("click", (event) => resizeSelected("width", -resizeStep(event)));
    document.getElementById("longerBtn").addEventListener("click", (event) => resizeSelected("width", resizeStep(event)));
    document.getElementById("thinnerBtn").addEventListener("click", (event) => resizeSelected("height", -resizeStep(event, 4, 16)));
    document.getElementById("thickerBtn").addEventListener("click", (event) => resizeSelected("height", resizeStep(event, 4, 16)));

    function toTs() {
      return `export type LabelLayout = {
  x: number;
  y: number;
  size: number;
  width: number;
  height: number;
};

export type RectLayout = {
  x: number;
  y: number;
  width: number;
  height: number;
};

export type PointLayout = {
  x: number;
  y: number;
};

export type GameLabelLayout = RectLayout & {
  titleSize: number;
  subtitleSize: number;
};

export type VisualNodeKind = "source" | "merge" | "tank" | "factory";
export type VisualPortName = "input" | "output" | "left" | "right" | "top" | "bottom";

export type VisualNodeLayout = RectLayout & {
  id: string;
  kind: VisualNodeKind;
  label: GameLabelLayout;
  pulse: PointLayout;
  ports?: Partial<Record<VisualPortName, PointLayout>>;
};

export type VisualPipeState = "empty" | "supply" | "pump";

export type VisualPipeLayout = {
  pipeId: string;
  state: VisualPipeState;
  from?: VisualPipeEndpoint;
  to?: VisualPipeEndpoint;
  connector: RectLayout;
  hitbox: RectLayout;
  glow: RectLayout;
  prompt: LabelLayout;
  flowPath: PointLayout[];
  thickness?: number;
};

export type VisualPipeEndpoint = {
  nodeId: string;
  port: VisualPortName;
};

export const LEVEL_ONE_LAYOUT = ${JSON.stringify(layout, null, 2)} as const;
`;
    }

    async function copyText(text) {
      output.value = text;
      output.focus();
      output.select();
      let copied = false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          copied = true;
        }
      } catch {
        copied = false;
      }
      if (!copied) {
        try {
          copied = document.execCommand("copy");
        } catch {
          copied = false;
        }
      }
      copyHint.textContent = copied ? "已复制。" : "浏览器拦截了自动复制，文本已经选中，按 Cmd+C 即可。";
    }

    document.getElementById("copyTsBtn").addEventListener("click", () => copyText(toTs()));
    document.getElementById("copyJsonBtn").addEventListener("click", () => copyText(JSON.stringify(layout, null, 2)));
    document.getElementById("resetBtn").addEventListener("click", () => {
      layout = clone(DEFAULT_LAYOUT);
      saveLayout();
      render();
      updateInspector();
    });

    saveLayout();
    render();
    updateInspector();
  </script>
</body>
</html>
